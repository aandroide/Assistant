name: Prova aggiornamento

on:
  push:
    branches: [prova-update]
    paths-ignore:
      - 'prova/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q S4MeAssistant_v1.zip -d src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2
      - name: Chiave di firma
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "S4ME_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "S4ME_STORE_PASS=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "S4ME_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "S4ME_KEY_PASS=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "Firma con la chiave dei secret"
          else
            echo "Firma con la chiave di prova"
          fi
      - name: Compila l'APK firmato
        working-directory: src/S4MeAssistant
        run: |
          VC=$((100 + ${{ github.run_number }}))
          gradle assembleRelease --no-daemon -Pvc=$VC -Pvn=1.1.${{ github.run_number }} 2>&1 | tee ../../build.log
          exit ${PIPESTATUS[0]}
      - name: Manifest di aggiornamento
        run: |
          APK=src/S4MeAssistant/app/build/outputs/apk/release/app-release.apk
          cp "$APK" S4MeAssistant.apk
          python3 - <<'PY'
          import json, hashlib, os
          run = int(os.environ.get("RUN", "0") or 0)
          data = open("S4MeAssistant.apk", "rb").read()
          m = {
            "schema": 1,
            "applicationId": "com.s4me.assistant",
            "versionName": "1.1.${{ github.run_number }}",
            "versionCode": 100 + ${{ github.run_number }},
            "minSdk": 21,
            "apks": {"universal": {"name": "S4MeAssistant.apk", "size": len(data),
                                    "sha256": hashlib.sha256(data).hexdigest()}}
          }
          json.dump(m, open("update.json", "w"), indent=2)
          print(open("update.json").read())
          PY
      - name: Pubblica la release di prova
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok=1
          : > release.log
          for i in 1 2 3 4 5 6; do
            if gh release view prova-update >/dev/null 2>&1; then
              echo "Tentativo $i: release esistente, sostituisco i file" >> release.log
              gh release upload prova-update S4MeAssistant.apk update.json --clobber >> release.log 2>&1 && { ok=0; break; }
            else
              echo "Tentativo $i: creo la release" >> release.log
              gh release create prova-update S4MeAssistant.apk update.json \
                --title "Prova aggiornamento" --notes "Release di prova per l'aggiornamento automatico" \
                --prerelease --target "${{ github.sha }}" >> release.log 2>&1 && { ok=0; break; }
            fi
            sleep 20
          done
          if [ $ok -eq 0 ]; then
            for i in 1 2 3 4 5 6; do
              gh release edit prova-update --draft=false --prerelease >> release.log 2>&1 && break
              echo "Pubblicazione, tentativo $i non riuscito" >> release.log
              sleep 20
            done
          fi
          cat release.log
          exit $ok
      - name: Salva APK e log nel ramo di prova
        if: always()
        run: |
          mkdir -p prova
          cp S4MeAssistant.apk update.json release.log prova/ || true
          tail -c 100000 build.log > prova/build_tail.log || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add prova
          git commit -m "Esito build di prova" || true
          git push
