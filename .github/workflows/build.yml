name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - 'apk/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Estrai il progetto dallo zip
        run: unzip -q S4MeAssistant_v1.zip -d src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      - name: Compila l'APK
        working-directory: src/S4MeAssistant
        run: gradle assembleDebug --no-daemon

      - name: Rinomina l'APK
        run: cp src/S4MeAssistant/app/build/outputs/apk/debug/app-debug.apk S4MeAssistant.apk

      - uses: actions/upload-artifact@v4
        with:
          name: S4MeAssistant
          path: S4MeAssistant.apk

      - name: Salva l'APK nella cartella apk del repository
        run: |
          mkdir -p apk
          cp S4MeAssistant.apk apk/S4MeAssistant.apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add apk/S4MeAssistant.apk
          git commit -m "APK aggiornato" || echo "Nessuna modifica da salvare"
          git push
