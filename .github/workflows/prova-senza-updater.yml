name: Prova senza updater

on:
  push:
    branches: [prova-senza-updater]
    paths-ignore:
      - 'prova/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q S4MeAssistant_v1.zip -d src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2
      - name: Chiave di firma
        env:
          KS_B64: ""
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "S4ME_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "S4ME_STORE_PASS=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "S4ME_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "S4ME_KEY_PASS=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "Firma con la chiave dei secret"
          else
            echo "Firma con la chiave di prova"
          fi
      - name: Compila le varianti D E F
        run: |
          python3 variants.py src/S4MeAssistant
          mkdir -p out
          i=0
          for n in D E F; do
            i=$((i+1))
            VC=$((600 + ${{ github.run_number }} * 10 + i))
            ( cd var_$n && gradle assembleRelease --no-daemon -Pvc=$VC -Pvn=1.6.$i 2>&1 | tee ../build_$n.log ; exit ${PIPESTATUS[0]} )
            cp var_$n/app/build/outputs/apk/release/app-release.apk out/S4MeAssistant_$n.apk
          done
      - name: Salva APK e log nel ramo di prova
        if: always()
        run: |
          mkdir -p prova
          cp out/*.apk prova/ || true
          for n in D E F; do tail -c 20000 build_$n.log > prova/build_$n.log || true; done
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add prova
          git commit -m "Esito build di prova" || true
          git push
